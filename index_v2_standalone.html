    function validateTopology(s1, s2, contracts) {
      const errors = [];
      const warnings = [];
      const allPlaced = [...s1, ...s2, ...contracts];
      const allIds = new Set(allPlaced.map(c => c.id));
      const s1Ids = new Set(s1.map(c => c.id));
      const s2Ids = new Set(s2.map(c => c.id));

      if (!contracts.some(c => c.id === 'W1')) {
        errors.push({ slot: 'GLOBAL', code: 'ERR_NO_W1', message: '👑 老闆尚未簽署【W1 總裁合約】（沒有設定 15% 毛利底線）' });
      }

      const checkSlot = (slotComponents, slotDisplayName, slotIds) => {
        const hasContext = slotIds.has('K1') || s1Ids.has('K1');
        if (slotComponents.length > 0 && !hasContext) {
          errors.push({ slot: slotDisplayName, code: 'ERR_NO_CONTEXT', message: `${slotDisplayName} 缺少【K1 現場工單】，AI 閉著眼睛沒資料可看` });
        }

        for (const comp of slotComponents) {
          for (const req of comp.requires) {
            const isSatisfied = req === 'K1' ? allIds.has(req) : slotIds.has(req);
            if (!isSatisfied) {
              errors.push({
                slot: slotDisplayName,
                code: 'ERR_MISSING_DEP',
                message: `${comp.name} 缺少前置積木 [${req}]，無法運作`
              });
            }
          }
        }

        const hasControl = slotComponents.some(c => c.pillar === 'CONTROL');
        const hasAct = slotComponents.some(c => c.pillar === 'ACT');
        if (hasControl && !hasAct && slotComponents.length > 0) {
          warnings.push({ slot: slotDisplayName, code: 'WARN_ORPHAN_CONTROL', message: `${slotDisplayName} 裝了開關/排程，但沒有裝任何【執行小手 ACT】，等於空轉` });
        }
      };

      checkSlot(s1, '⚡ ⑤ 小腦反射區 (S1)', s1Ids);
      checkSlot(s2, '🧠 ⑥ 大腦精算區 (S2)', s2Ids);

      const hasActTools = allPlaced.some(c => c.id === 'A1' || c.id === 'A3');
      const hasMcp = allPlaced.some(c => c.id === 'C5');
      const actCostMultiplier = (hasActTools && !hasMcp) ? 3.0 : 1.0;
      if (hasActTools && !hasMcp) {
        warnings.push({ slot: 'GLOBAL', code: 'WARN_NO_MCP', message: '⚠️ 沒裝【C5 萬國插座 MCP】，所有工具每次呼叫成本暴增 300%！' });
      }

      const reverseInS1 = s1.filter(c => c.id === 'W3' || c.id === 'C2' || c.id === 'K3');
      const isReverseQuality = reverseInS1.length > 0;
      if (isReverseQuality) {
        warnings.push({
          slot: '⚡ ⑤ 小腦反射區 (S1)',
          code: 'WARN_REVERSE_QUALITY',
          message: `🚨【好心做壞事！】在小腦快篩區誤放了慢想積木 [${reverseInS1.map(c=>c.id).join(', ')}]，日常小單算力大暴錶、延遲超重！`
        });
      }

      return {
        valid: errors.length === 0,
        errors,
        warnings,
        actCostMultiplier,
        isReverseQuality,
        reverseComponents: reverseInS1
      };
    }

        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }
      return deck;
    }

      Terminal: () => <svg className="w-4 h-4 inline-block" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>,
      Play: () => <svg className="w-4 h-4 inline-block" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path strokeLinecap="round" strokeLinejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>,
      Info: () => <svg className="w-4 h-4 inline-block" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>,
      Sparkles: () => <svg className="w-4 h-4 inline-block" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.286L13 21l-2.286-6.857L5 12l5.714-2.286L13 3z"/></svg>
    };

    // =========================================================================
    // 5. MAIN APP COMPONENT (WITH PHASE 2 WIZARD & AUTOPSY)
    // =========================================================================

    function App() {
      const [scenarioKey, setScenarioKey] = useState('MANUFACTURING');
      const [currentRound, setCurrentRound] = useState(1);
      const [companyCapital, setCompanyCapital] = useState(100000);
      const [lossRatio, setLossRatio] = useState(4);
      const [activeRole, setActiveRole] = useState('EXECUTIVE'); // Start as Executive for Wizard!

      const [contracts, setContracts] = useState([]);
      const [slotS1, setSlotS1] = useState([]);
      const [slotS2, setSlotS2] = useState([]);

      const [deck, setDeck] = useState(() => createFreshDeck('MANUFACTURING'));
      const [drawnCards, setDrawnCards] = useState([]);
      const [currentExecutingCard, setCurrentExecutingCard] = useState(null);
      const [executionStatus, setExecutionStatus] = useState('IDLE');

      const [confusionMatrix, setConfusionMatrix] = useState({
        passed: 0,
        type1Error: 0,
        type2Error: 0,
        intercepted: 0
      });

      const [ledgerLog, setLedgerLog] = useState([
        `[系統開機]: 遊戲準備就緒！當前任務：${SCENARIOS['MANUFACTURING'].title}`,
        `[新手保姆模式]: 已開啟！請跟著頂部的保姆導引一步步操作。`
      ]);

      // Phase 2: Onboarding Wizard & Autopsy Modal
      const [isTutorialActive, setIsTutorialActive] = useState(true);
      const [tutorialStep, setTutorialStep] = useState(1); // 1: Sign W1, 2: Place K1/A1 to S1, 3: Draw First Card, 4: Done
      const [showAutopsyModal, setShowAutopsyModal] = useState(false);
      const [autopsyData, setAutopsyData] = useState(null);

      // Modals & Toast State
      const [showHITLModal, setShowHITLModal] = useState(false);
      const [pendingHITLCard, setPendingHITLCard] = useState(null);
      const [showFourQuestionsModal, setShowFourQuestionsModal] = useState(false);
      const [distilledSkillCreated, setDistilledSkillCreated] = useState(false);
      const [toast, setToast] = useState(null);

      const scenario = SCENARIOS[scenarioKey];
      const logContainerRef = useRef(null);

      const triggerToast = (text, type = 'info') => {
        setToast({ text, type });
        setTimeout(() => {
          setToast(null);
        }, 3200);
      };

      useEffect(() => {
        if (logContainerRef.current) {
          logContainerRef.current.scrollTop = logContainerRef.current.scrollHeight;
        }
      }, [ledgerLog]);

      const linterResult = useMemo(() => {
        return validateTopology(slotS1, slotS2, contracts);
      }, [slotS1, slotS2, contracts]);

      const metrics = useMemo(() => {
        const mult = linterResult.actCostMultiplier;
        const calcSlot = (slot) => {
          let cost = 0;
          let latency = 0;
          slot.forEach(c => {
            const cCost = (c.pillar === 'ACT') ? c.cost * mult : c.cost;
            cost += cCost;
            latency += c.latency;
          });
          return { cost, latency };
        };
        const s1M = calcSlot(slotS1);
        const s2M = calcSlot(slotS2);
        const totalCost = s1M.cost + s2M.cost;
        const s1Share = totalCost > 0 ? Math.round((s1M.cost / totalCost) * 100) : 0;
        return { s1: s1M, s2: s2M, s1Share, mult };
      }, [slotS1, slotS2, linterResult]);

      const addLog = (msg) => {
        const timestamp = new Date().toLocaleTimeString();
        setLedgerLog(prev => [...prev, `[${timestamp}] ${msg}`]);
      };

      const handleSwitchScenario = (key) => {
        setScenarioKey(key);
        setDeck(createFreshDeck(key));
        setDrawnCards([]);
        setCurrentExecutingCard(null);
        setExecutionStatus('IDLE');
        setCompanyCapital(100000);
        setConfusionMatrix({ passed: 0, type1Error: 0, type2Error: 0, intercepted: 0 });
        setDistilledSkillCreated(false);
        triggerToast(`已切換情境至：${SCENARIOS[key].title}，牌堆已重新洗牌！`, 'info');
      };

      // Component Add/Move with Tutorial Progress Hooks
      const handleAddOrMove = (comp, targetSlot) => {
        if (activeRole !== 'MANAGER' && targetSlot !== 'GLOBAL_CONTRACT') {
          triggerToast('⚠️ 只有【📐 經理】能搬動積木！請點上方切換為經理。', 'warning');
          return;
        }
        if (activeRole !== 'EXECUTIVE' && targetSlot === 'GLOBAL_CONTRACT') {
          triggerToast('⚠️ 只有【👑 老闆】能簽署底線合約！請點上方切換為老闆。', 'warning');
          return;
        }

        if (targetSlot === 'GLOBAL_CONTRACT') {
          if (!contracts.some(c => c.id === comp.id)) {
            setContracts([comp]);
            addLog(`👑 老闆已簽署合約：[${comp.name}]！鎖定賺錢底線。`);
            triggerToast('👑 老闆成功簽署【W1 總裁合約】！底線已鎖死。', 'info');

            // Advance Tutorial Step 1 -> Step 2
            if (isTutorialActive && tutorialStep === 1) {
              setTutorialStep(2);
              setActiveRole('MANAGER'); // Auto-switch to Manager for beginner convenience!
              triggerToast('✨ 太棒了！老闆已簽好合約。現在系統自動切換為【經理】，請裝配基礎積木！', 'info');
            }
          }
          return;
        }

        if (!comp.allowedSlots.includes(targetSlot)) {
          triggerToast(`❌ 積木 [${comp.name}] 不適合放在這個槽位！`, 'error');
          return;
        }

        const newS1 = slotS1.filter(c => c.id !== comp.id);
        const newS2 = slotS2.filter(c => c.id !== comp.id);

        if (targetSlot === 'SYSTEM_1_SLOT_5') {
          const updatedS1 = [...newS1, comp];
          setSlotS1(updatedS1);
          setSlotS2(newS2);
          addLog(`📐 經理將 [${comp.name}] 裝上 ⚡ ⑤ 小腦反射區 (直覺快篩)`);

          // Check Tutorial Step 2 -> Step 3 (Both K1 and A1 in S1)
          if (isTutorialActive && tutorialStep === 2) {
            const hasK1 = updatedS1.some(c => c.id === 'K1');
            const hasA1 = updatedS1.some(c => c.id === 'A1');
            if (hasK1 && hasA1) {
              setTutorialStep(3);
              triggerToast('🎯 完美！小腦已擁有【現場眼睛 K1】與【執行小手 A1】！現在可以抽牌測試了！', 'info');
            }
          }
        } else if (targetSlot === 'SYSTEM_2_SLOT_6') {
          setSlotS2([...newS2, comp]);
          setSlotS1(newS1);
          addLog(`📐 經理將 [${comp.name}] 裝上 🧠 ⑥ 大腦精算區 (慢想深思)`);
        }
      };

      const handleRemoveComponent = (comp, fromSlot) => {
        if (activeRole !== 'MANAGER') {
          triggerToast('⚠️ 只有【📐 經理】可以卸載積木！', 'warning');
          return;
        }
        if (fromSlot === 'SYSTEM_1_SLOT_5') {
          setSlotS1(slotS1.filter(c => c.id !== comp.id));
          addLog(`📐 卸下小腦的 [${comp.name}]`);
        } else if (fromSlot === 'SYSTEM_2_SLOT_6') {
          setSlotS2(slotS2.filter(c => c.id !== comp.id));
          addLog(`📐 卸下大腦的 [${comp.name}]`);
        }
      };

      // Execute Single Card
      const executeSingleCard = (card) => {
        setCurrentExecutingCard(card);

        if (linterResult.isReverseQuality && card.type === 'ROUTINE') {
          const penalty = 2000;
          setCompanyCapital(prev => prev - penalty);
          addLog(`🚨【好心做壞事懲罰】：小腦誤裝慢想積木，處理日常單 #${card.id} 等太久被客訴！被罰扣款 -$${penalty}`);
        }

        if (card.type === 'ROUTINE') {
          const s1Ready = slotS1.some(c => c.id === 'K1') && (slotS1.some(c => c.id === 'A1') || slotS1.some(c => c.id === 'A2') || slotS1.some(c => c.id === 'A2_DISTILLED'));
          const profit = s1Ready ? card.baseMargin : Math.round(card.baseMargin * 0.4);
          const execCost = metrics.s1.cost + (s1Ready ? 0 : metrics.s2.cost);

          setCompanyCapital(prev => prev + profit - execCost);
          setConfusionMatrix(prev => ({ ...prev, passed: prev.passed + 1 }));
          addLog(`✅【常態平安出貨】：${card.title}。進帳 +$${profit}，API 消耗 -$${execCost}`);

          // Check Tutorial Step 3 -> Step 4
          if (isTutorialActive && tutorialStep === 3) {
            setTutorialStep(4);
            triggerToast('🎉 恭喜賺到第一筆收入！新手教學圓滿完成！現在進入自由模式，注意隨時可能出現的黑天鵝！', 'info');
          }

          return { status: 'CONTINUE' };
        }

        if (card.type === 'LEFT_TAIL') {
          addLog(`💥【抽中劇毒黑天鵝！！】：${card.title}`);
          const hasHook = slotS1.some(c => c.id === 'C4') || slotS2.some(c => c.id === 'C4');

          if (hasHook) {
            setConfusionMatrix(prev => ({ ...prev, intercepted: prev.intercepted + 1, type1Error: prev.type1Error + 1 }));
            addLog(`🛡️【C4 警報器逼逼叫！】：毛利低於 15% 強制緊急煞車！轉交基層員工做最後裁決。`);
            setPendingHITLCard(card);
            setShowHITLModal(true);
            setExecutionStatus('HITL_PROMPT');
            return { status: 'HALT_HITL' };
          } else {
            // Missing Hook -> Type 2 Error -> Trigger Autopsy Modal!
            setConfusionMatrix(prev => ({ ...prev, type2Error: prev.type2Error + 1 }));
            const penalty = card.hazardPenalty;
            setCompanyCapital(prev => prev - penalty);
            setExecutionStatus('BANKRUPT');
            addLog(`☠️【致命大意！把眼鏡蛇當繩子抓】：沒裝 C4 警報器！系統把賠錢急單直接放行，違約慘賠 -$${penalty}！公司倒閉！`);

            // Phase 2 Autopsy Report Pop!
            setAutopsyData({
              hazardCardTitle: card.title,
              penalty: penalty,
              reason: '未配置【C4 保命警報器 Hook】！系統在面對毛利跌破 15% 的高危險訂單時，毫無感知地直接自動放行，導致工廠違約暴死！',
              cure: '在 ⑤ 號小腦反射區裝上【C4 保命警報器】，當毛利跌破 15% 時系統會逼逼叫並強制煞車轉交現場人員審查！'
            });
            setShowAutopsyModal(true);

            return { status: 'HALT_BANKRUPT' };
          }
        }

        if (card.type === 'RIGHT_TAIL') {
          addLog(`✨【抽到大鑽石機會卡！】：${card.title}`);
          const s2Equipped = card.requiresInS2.every(reqId => slotS2.some(c => c.id === reqId));
          const hasDistilledSkill = slotS1.some(c => c.id === 'A2_DISTILLED');

          if (s2Equipped || hasDistilledSkill) {
            const reward = card.reward;
            setCompanyCapital(prev => prev + reward);
            addLog(`🏆【挖到金礦！成功抓住大商機】：${hasDistilledSkill ? '靠小腦固化 SOP 秘笈' : '靠大腦深思探索'}順利簽下大合約！獎金 +$${reward}`);
            triggerToast(`🎉 恭喜！抓住右尾大商機，巨額進帳 +$${reward}！`, 'info');
          } else {
            addLog(`💨【眼睜睜錯過大商機】：大腦缺少完整的探勘鏈 [${card.requiresInS2.join(' + ')}]，無法即時給出證明，機會溜走（$0）。`);
          }
          return { status: 'CONTINUE' };
        }

        return { status: 'CONTINUE' };
      };

      const handleDrawAndExecute = (count = 1) => {
        if (!linterResult.valid) {
          triggerToast('❌ 請先依照下方診斷修正積木擺放，才能抽牌！', 'error');
          return;
        }
        if (executionStatus === 'BANKRUPT') {
          triggerToast('☠️ 公司已經破產倒閉了！請查看死因解剖報告或點擊重置。', 'error');
          return;
        }
        if (deck.length === 0) {
          setExecutionStatus('ROUND_COMPLETE');
          triggerToast('🎉 20 張牌全部處理完畢！請檢視戰績或推進至下一回合。', 'info');
          return;
        }

        let currentDeck = [...deck];
        let currentDrawn = [...drawnCards];

        for (let i = 0; i < count; i++) {
          if (currentDeck.length === 0) break;
          const card = currentDeck.shift();
          currentDrawn.push(card);

          const result = executeSingleCard(card);

          if (result.status === 'HALT_HITL' || result.status === 'HALT_BANKRUPT') {
            setDeck(currentDeck);
            setDrawnCards(currentDrawn);
            return;
          }
        }

        setDeck(currentDeck);
        setDrawnCards(currentDrawn);
      };

      const handleHITLDecision = (choice) => {
        if (!pendingHITLCard) return;

        if (choice === 'A') {
          const reward = pendingHITLCard.hitlSuccessReward;
          setCompanyCapital(prev => prev + reward);
          addLog(`🛠️【現場基層裁決・選 A】：現場人員成功要求客戶加價延期！保住利潤，獲利 +$${reward}，寫入帳本！`);
          setShowHITLModal(false);
          setPendingHITLCard(null);
          setExecutionStatus('IDLE');
          triggerToast('✅ 決策正確！成功化解危機並賺到利潤！', 'info');
        } else {
          const penalty = pendingHITLCard.hazardPenalty;
          setCompanyCapital(prev => prev - penalty);
          setConfusionMatrix(prev => ({ ...prev, type2Error: prev.type2Error + 1 }));
          setExecutionStatus('BANKRUPT');
          addLog(`☠️【現場基層裁決・選 B】：現場人員盲目放行！導致嚴重違約賠償 -$${penalty}，直接宣告倒閉！`);
          setShowHITLModal(false);
          setPendingHITLCard(null);

          // Autopsy for wrong HITL choice
          setAutopsyData({
            hazardCardTitle: pendingHITLCard.title,
            penalty: penalty,
            reason: '現場人員在 HITL 緊急控制台中選擇了【硬幹盲目放行】！在毛利只剩 12% 且機台故障時強行接單，釀成違約滅頂之災！',
            cure: '遇到低毛利異常單時，現場必須堅守【W1 老闆底線】，選擇要求加價或延期，不可盲目妥協放行！'
          });
          setShowAutopsyModal(true);
        }
      };

      // Resurrect & Auto-Equip C4 Hook (Phase 2 Instant Learning Loop)
      const handleResurrectWithHook = () => {
        setCompanyCapital(100000);
        setExecutionStatus('IDLE');
        setShowAutopsyModal(false);

        // Auto-equip C4 to S1
        const compHook = COMPONENTS_SSOT.find(c => c.id === 'C4');
        if (compHook && !slotS1.some(c => c.id === 'C4')) {
          setSlotS1(prev => [...prev.filter(c => c.id !== 'C4'), compHook]);
        }

        setDeck(createFreshDeck(scenarioKey));
        setDrawnCards([]);
        setCurrentExecutingCard(null);

        addLog(`✨【公司滿血復活】：資本恢復 $100,000，並已為你自動裝上【C4 保命警報器】！現在再來抽牌試試看！`);
        triggerToast('🛡️ 復活成功！已為你裝上【C4 警報器】，黑天鵝再來也不怕了！', 'info');
      };

      const handleDistillS2ToS1 = () => {
        const canDistill = slotS2.some(c => c.id === 'W3') && slotS2.some(c => c.id === 'A3');
        if (!canDistill) {
          triggerToast('⚠️ 大腦 S2 必須同時有【W3 天才思考】與【A3 外部外掛】才能固化成 SOP！', 'warning');
          return;
        }

        const remainingS2 = slotS2.filter(c => c.id !== 'W3' && c.id !== 'A3');
        const distilledSkill = {
          id: 'A2_DISTILLED',
          code: 'ACT.2*',
          name: '現貨速查 SOP 包 (Distilled)',
          simpleTitle: '【固化秘笈】大腦探索沉澱為快篩SOP',
          pillar: 'ACT',
          cost: 45,
          latency: 2,
          allowedSlots: ['SYSTEM_1_SLOT_5'],
          requires: ['A1'],
          description: '把天才大腦摸索出來的規則，抄成確定性的 SOP 填空卡，小腦 2 秒就能搶到大訂單！',
          reverseRisk: '無'
        };

        setSlotS2(remainingS2);
        setSlotS1(prev => [...prev.filter(c => c.id !== 'A2_DISTILLED'), distilledSkill]);
        setDistilledSkillCreated(true);
        addLog(`📦【抄筆記固化為 SOP】：大腦探索經驗已封裝成小腦快速秘笈！速度快 7 倍，成本省 85%！`);
        triggerToast('📦 知識蒸餾完成！大腦昂貴經驗已固化成小腦 SOP！', 'info');
      };

      const handleNextRound = () => {
        if (currentRound < 3) {
          const nextR = currentRound + 1;
          setCurrentRound(nextR);
          setDeck(createFreshDeck(scenarioKey));
          setDrawnCards([]);
          setExecutionStatus('IDLE');
          if (nextR === 3) {
            addLog(`📢【Round 3 市場警報】：原本大家覺得很酷的『抓現貨功能』，現在爛大街變成『基本標配』了！解鎖「抄筆記固化為 SOP」按鈕！`);
            triggerToast('📢 進入第 3 回合：市場變嚴格！魅力功能已退化為基本要求！', 'warning');
          } else {
            addLog(`🚀 進入 Round ${nextR}：測試你的防守與合約防線！`);
            triggerToast(`🚀 進入第 ${nextR} 回合！`, 'info');
          }
        } else {
          triggerToast('🏆 你已經通過全部 3 個考驗階段！', 'info');
        }
      };

      const handleResetGame = () => {
        setCompanyCapital(100000);
        setCurrentRound(1);
        setDeck(createFreshDeck(scenarioKey));
        setDrawnCards([]);
        setCurrentExecutingCard(null);
        setExecutionStatus('IDLE');
        setSlotS1([]);
        setSlotS2([]);
        setContracts([]);
        setConfusionMatrix({ passed: 0, type1Error: 0, type2Error: 0, intercepted: 0 });
        setDistilledSkillCreated(false);
        setIsTutorialActive(true);
        setTutorialStep(1);
        setActiveRole('EXECUTIVE');
        addLog(`🔄 全局遊戲已重置，資本恢復 $100,000，重啟新手保姆導航。`);
        triggerToast('🔄 遊戲已全新重啟！', 'info');
      };

      const getPillarColor = (pillar) => {
        switch (pillar) {
          case 'KNOW': return 'border-blue-500/80 bg-blue-950/40 text-blue-300';
          case 'WANT': return 'border-amber-500/80 bg-amber-950/40 text-amber-300';
          case 'ACT': return 'border-red-500/80 bg-red-950/40 text-red-300';
          case 'CONTROL': return 'border-emerald-500/80 bg-emerald-950/40 text-emerald-300';
          default: return 'border-slate-700 bg-slate-900 text-slate-300';
        }
      };

      const getPillarBadge = (pillar) => {
        switch (pillar) {
          case 'KNOW': return 'bg-blue-500/20 text-blue-400 border-blue-500/40';
          case 'WANT': return 'bg-amber-500/20 text-amber-400 border-amber-500/40';
          case 'ACT': return 'bg-red-500/20 text-red-400 border-red-500/40';
          case 'CONTROL': return 'bg-emerald-500/20 text-emerald-400 border-emerald-500/40';
          default: return 'bg-slate-700 text-slate-300 border-slate-600';
        }
      };

      return (
        <div className="flex flex-col min-h-screen relative">

          {/* ================================================================= */}
          {/* TOAST FLOATING BANNER                                             */}
          {/* ================================================================= */}

                            <span className="font-semibold text-slate-200">{comp.simpleTitle}</span>
                          </div>
                          <button
                            onClick={() => handleRemoveComponent(comp, 'SYSTEM_1_SLOT_5')}
                            className="text-slate-400 hover:text-red-400 ml-2"
                            title="卸載此積木"
                          >
                            <Icons.Cross />
                          </button>
                        </div>
                      ))
                    )}
                  </div>

                  {/* Round 3 Distill Button Slot */}
                  {currentRound === 3 && (
                    <div className="mt-3">
                      <button
                        onClick={handleDistillS2ToS1}
                        disabled={distilledSkillCreated}
                        className="w-full py-2 rounded-lg bg-gradient-to-r from-amber-600 to-emerald-600 hover:from-amber-500 hover:to-emerald-500 text-xs font-bold text-white shadow-md shadow-amber-500/20 flex items-center justify-center gap-1.5 transition disabled:opacity-40"
                      >
                        <Icons.Package />
                        {distilledSkillCreated ? '✓ 已成功抄成快篩 SOP！' : '📦 抄筆記：大腦經驗固化為小腦 SOP (Distill)'}
                      </button>
                    </div>
                  )}
                </div>

                {/* SLOT ⑥: SYSTEM 2 DEEP REASONING */}
                <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col relative">
                  <div className="flex items-center justify-between pb-2 border-b border-slate-800">
                    <div className="flex items-center gap-2">
                      <div className="w-6 h-6 rounded bg-purple-500/20 border border-purple-500/40 text-purple-400 flex items-center justify-center font-bold text-xs">
                        ⑥
                      </div>
                      <div>
                        <h3 className="text-xs font-bold text-white">🧠 大腦精算區 (System 2)</h3>
                        <p className="text-[10px] text-slate-400">深思熟慮10秒 • 專抓大商機與外協</p>
                      </div>
                    </div>
                    <span className="text-[10px] text-purple-400 font-mono">
                      每單成本: ${metrics.s2.cost} / {metrics.s2.latency}秒
                    </span>
                  </div>

                  {/* Drop zone content */}
                  <div className="flex-1 min-h-[140px] mt-3 bg-slate-950/60 rounded-lg p-2.5 border border-dashed border-slate-800 space-y-2">
                    {slotS2.length === 0 ? (
                      <div className="h-full flex flex-col items-center justify-center text-slate-500 text-xs py-8 text-center">
                        <span>大腦尚未配置</span>
                        <span className="text-[10px] mt-1 text-slate-400">（適合放 W3 天才思考、A3 外部外掛來搶大訂單）</span>
                      </div>
                    ) : (
                      slotS2.map(comp => (
                        <div
                          key={comp.id}
                          className={`p-2 rounded border flex items-center justify-between text-xs ${getPillarColor(comp.pillar)}`}
                        >
                          <div>
                            <span className="font-bold font-mono mr-1.5">[{comp.code}]</span>
                            <span className="font-semibold text-slate-200">{comp.simpleTitle}</span>
                          </div>
                          <button
                            onClick={() => handleRemoveComponent(comp, 'SYSTEM_2_SLOT_6')}
                            className="text-slate-400 hover:text-red-400 ml-2"
                            title="卸載此積木"
                          >
                            <Icons.Cross />
                          </button>
                        </div>
                      ))
                    )}
                  </div>
                </div>

              </div>

              {/* 3. CONFUSION MATRIX LIVE COUNTER */}
              <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-lg">
                <div className="flex items-center justify-between mb-3">
                  <h3 className="text-xs font-bold text-white flex items-center gap-2">
                    <Icons.Terminal />
                    <span>即時公司防禦戰況記分板 (混淆矩陣)</span>
                  </h3>
                  <span className="text-[10px] text-slate-400">
                    警覺比率: 4 : 1 (漏放毒蛇代價是誤殺的4倍)
                  </span>
                </div>

                <div className="grid grid-cols-4 gap-3 text-center">
                  <div className="bg-slate-950 p-2.5 rounded-lg border border-slate-800">
                    <div className="text-[11px] text-cyan-400 font-bold">🟢 平安過關</div>
                    <div className="text-lg font-black text-cyan-300 mt-1">{confusionMatrix.passed}</div>
                    <div className="text-[9px] text-slate-400 mt-0.5">常態訂單順暢賺錢</div>
                  </div>

                  <div className="bg-slate-950 p-2.5 rounded-lg border border-slate-800">
                    <div className="text-[11px] text-amber-400 font-bold">😱 自己嚇自己</div>
                    <div className="text-lg font-black text-amber-300 mt-1">{confusionMatrix.type1Error}</div>
                    <div className="text-[9px] text-slate-400 mt-0.5">誤殺轉人工看一眼 (微小工錢)</div>
                  </div>

                  <div className="bg-slate-950 p-2.5 rounded-lg border border-slate-800">
                    <div className="text-[11px] text-red-500 font-bold">☠️ 踩中劇毒黑天鵝！</div>
                    <div className={`text-lg font-black mt-1 ${confusionMatrix.type2Error > 0 ? 'text-red-500 animate-pulse' : 'text-slate-500'}`}>
                      {confusionMatrix.type2Error}
                    </div>
                    <div className="text-[9px] text-red-400 mt-0.5">把毒蛇當繩子抓 (公司倒閉)</div>
                  </div>

                  <div className="bg-slate-950 p-2.5 rounded-lg border border-slate-800">
                    <div className="text-[11px] text-emerald-400 font-bold">🛡️ 警報器成功煞車</div>
                    <div className="text-lg font-black text-emerald-300 mt-1">{confusionMatrix.intercepted}</div>
                    <div className="text-[9px] text-slate-400 mt-0.5">C4 護盾阻斷毒蛇</div>
                  </div>
                </div>
              </div>

            </section>

            {/* --------------------------------------------------------------- */}
            {/* RIGHT SIDEBAR: KANO CUSTOMER DASHBOARD & LOG (3 cols)            */}
            {/* --------------------------------------------------------------- */}
            <section className="col-span-12 lg:col-span-3 flex flex-col gap-4">

              {/* 1. CUSTOMER SATISFACTION EMOJI DASHBOARD & KANO CURVE */}
              <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-lg">
                <div className="flex items-center justify-between pb-2 border-b border-slate-800 mb-3">
                  <h3 className="text-xs font-bold text-white flex items-center gap-1.5">
                    <Icons.Zap />
                    <span>客戶臉色晴雨表 (Kano 品質曲線)</span>
                  </h3>
                  <span className="text-[10px] text-cyan-400 font-mono">第 {currentRound} 關</span>
                </div>

                {/* 4 EMOJI STATUS TILES */}
                <div className="grid grid-cols-2 gap-2 mb-3">
                  <div className={`p-2 rounded border text-[11px] ${
                    slotS1.length > 0 ? 'bg-cyan-950/80 border-cyan-500 text-cyan-300' : 'bg-slate-950 border-slate-800 text-slate-500'
                  }`}>
                    <div className="font-bold flex items-center gap-1">
                      <span>🟢 及格底線</span>
                    </div>
                    <div className="text-[9px] text-slate-400 mt-0.5">沒做到客戶直接掀桌</div>
                  </div>

                  <div className={`p-2 rounded border text-[11px] ${
                    metrics.s1.latency <= 2 && slotS1.length > 0 ? 'bg-emerald-950/80 border-emerald-500 text-emerald-300' : 'bg-slate-950 border-slate-800 text-slate-500'
                  }`}>
                    <div className="font-bold flex items-center gap-1">
                      <span>🔵 速度滿意</span>
                    </div>
                    <div className="text-[9px] text-slate-400 mt-0.5">出貨越快客戶越開心</div>
                  </div>

                  <div className={`p-2 rounded border text-[11px] ${
                    slotS2.length >= 3 || distilledSkillCreated ? 'bg-amber-950/80 border-amber-500 text-amber-300 ring-1 ring-amber-500' : 'bg-slate-950 border-slate-800 text-slate-500'
                  }`}>
                    <div className="font-bold flex items-center gap-1">
                      <span>🌟 驚喜大紅包</span>
                    </div>
                    <div className="text-[9px] text-slate-400 mt-0.5">搶到現貨給客戶大驚喜</div>
                  </div>

                  <div className={`p-2 rounded border text-[11px] ${
                    linterResult.isReverseQuality ? 'bg-red-950 border-red-500 text-red-300 animate-pulse ring-1 ring-red-500' : 'bg-slate-950 border-slate-800 text-slate-500'
                  }`}>
                    <div className="font-bold flex items-center gap-1">
                      <span>🤮 好心做壞事</span>
                    </div>
                    <div className="text-[9px] text-slate-400 mt-0.5">殺雞用牛刀客戶等到崩潰</div>
                  </div>
                </div>

                {/* SVG Kano Curve */}
                <div className="bg-slate-950 rounded-lg p-2 border border-slate-800 relative">
                  <svg viewBox="0 0 240 180" className="w-full h-40">
                    <line x1="20" y1="90" x2="220" y2="90" stroke="#334155" strokeWidth="1.5" />
                    <line x1="120" y1="10" x2="120" y2="170" stroke="#334155" strokeWidth="1.5" />
                    <text x="200" y="85" fill="#64748b" fontSize="8">速度越快 →</text>
                    <text x="125" y="20" fill="#64748b" fontSize="8">心情越好 ↑</text>

                    {/* ① Must-be Curve */}
                    <path d="M 20,165 Q 110,130 220,105" fill="none" stroke="#38bdf8" strokeWidth="2" strokeDasharray="3,3" />
                    <text x="165" y="115" fill="#38bdf8" fontSize="8">① 基本及格線</text>

                    {/* ② One-Dimensional Linear Curve */}
                    <path d="M 30,160 L 210,20" fill="none" stroke="#10b981" strokeWidth="2" />
                    <text x="165" y="35" fill="#10b981" fontSize="8">② 越快越爽</text>

                    {/* ③ Attractive Curve */}
                    <path d="M 20,85 Q 130,70 210,15" fill="none" stroke="#f59e0b" strokeWidth="2" />
                    <text x="145" y="15" fill="#f59e0b" fontSize="8">③ 驚喜商機</text>

                    {/* ④ Reverse Quality Curve */}
                    <path d="M 30,20 Q 110,80 210,165" fill="none" stroke="#ef4444" strokeWidth="2" strokeDasharray="4,2" />
                    <text x="145" y="165" fill="#ef4444" fontSize="8">④ 好心做壞事</text>

                    {/* Real-time Dynamic Status Dot */}
                    {linterResult.isReverseQuality ? (
                      <circle cx="180" cy="145" r="6" fill="#ef4444" className="animate-ping" />
                    ) : (
                      <circle cx={slotS2.length > 2 ? "170" : "110"} cy={slotS2.length > 2 ? "45" : "75"} r="5" fill="#38bdf8" className="animate-pulse" />
                    )}
                  </svg>
                </div>
              </div>

              {/* 2. LEDGER EXECUTION AUDIT LOG */}
              <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col flex-1 shadow-lg">
                <div className="flex items-center justify-between pb-2 border-b border-slate-800 mb-2">
                  <h3 className="text-xs font-bold text-white flex items-center gap-1.5">
                    <Icons.Terminal />
                    <span>LEDGER 公司經營存摺紀錄</span>
                  </h3>
                  <button
                    onClick={() => setLedgerLog([`[系統紀錄]: 日誌已清空。`])}
                    className="text-[10px] text-slate-400 hover:text-slate-200"
                  >
                    清空
                  </button>
                </div>

                <div
                  ref={logContainerRef}
                  className="flex-1 overflow-y-auto bg-slate-950 rounded-lg p-2.5 font-mono text-[10px] leading-relaxed space-y-1.5 max-h-72 border border-slate-800"
                >
                  {ledgerLog.map((log, idx) => (
                    <div
                      key={idx}
                      className={
                        log.includes('🚨') || log.includes('☠️') ? 'text-red-400' :
                        log.includes('🏆') || log.includes('✨') ? 'text-amber-300' :
                        log.includes('🛡️') || log.includes('✅') ? 'text-emerald-400' :
                        'text-slate-400'
                      }
                    >
                      {log}
                    </div>
                  ))}
                </div>
              </div>

            </section>

          </main>

          {/* ================================================================= */}
          {/* PHASE 2: AUTOPSY REPORT MODAL (ON BANKRUPTCY)                     */}
          {/* ================================================================= */}
          {showAutopsyModal && autopsyData && (
            <div className="fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border-2 border-red-600 rounded-2xl max-w-xl w-full p-6 shadow-2xl relative">
                <div className="flex items-center gap-3 text-red-500 mb-4 pb-3 border-b border-red-900/50">
                  <div className="text-3xl">💀</div>
                  <div>
                    <h3 className="text-lg font-black text-white tracking-wide">
                      公司破產宣告與架構死因解剖報告
                    </h3>
                    <p className="text-xs text-red-400 font-mono">
                      [POST-MORTEM AUTOPSY]: 踩中 Type 2 劇毒黑天鵝！
                    </p>
                  </div>
                </div>

                <div className="space-y-3.5 text-xs text-slate-300">
                  <div className="p-3 rounded-xl bg-red-950/40 border border-red-500/30">
                    <div className="font-bold text-red-300 mb-1 flex items-center gap-1.5">
                      <span>🩸 致命死因：</span>
                      <span className="font-mono text-white">{autopsyData.hazardCardTitle}</span>
                    </div>
                    <p className="text-slate-300">
                      遭遇黑天鵝暴跌！工廠違約遭索賠 <strong className="text-red-400 font-mono">-${autopsyData.penalty.toLocaleString()}</strong>，資本瞬間歸零，公司直接宣告破產出局！
                    </p>
                  </div>

                  <div className="p-3 rounded-xl bg-slate-950 border border-slate-800">
                    <div className="font-bold text-amber-400 mb-1">
                      🔍 為什麼會死得這麼慘？（Type 2 漏放錯誤）：
                    </div>
                    <p className="text-slate-400 leading-relaxed">
                      {autopsyData.reason}
                    </p>
                  </div>

                  <div className="p-3 rounded-xl bg-emerald-950/30 border border-emerald-500/30">
                    <div className="font-bold text-emerald-400 mb-1">
                      💊 急救處方籤（如何一秒破局？）：
                    </div>
                    <p className="text-slate-300 leading-relaxed">
                      {autopsyData.cure}
                    </p>
                  </div>
                </div>

                {/* Instant Recovery Button */}
                <div className="mt-6 flex flex-col gap-2">
                  <button
                    onClick={handleResurrectWithHook}
                    className="w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-emerald-600 to-cyan-600 hover:from-emerald-500 hover:to-cyan-500 text-sm font-black text-white shadow-xl shadow-emerald-500/30 flex items-center justify-center gap-2 transition"
                  >
                    <span>🛡️ 滿血復活，並自動為我裝上【C4 保命警報器】！</span>
                  </button>
                  <button
                    onClick={() => setShowAutopsyModal(false)}
                    className="text-xs text-slate-400 hover:text-slate-200 text-center py-1 font-mono"
                  >
                    關閉報告，我自己手動調整
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ================================================================= */}
          {/* FRONTLINE HITL EMERGENCY MODAL                                    */}
          {/* ================================================================= */}
          {showHITLModal && pendingHITLCard && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border-2 border-red-500 rounded-2xl max-w-xl w-full p-6 shadow-2xl relative">
                <div className="flex items-center gap-3 text-red-500 mb-3">
                  <div className="p-2 rounded-lg bg-red-950/80 border border-red-500/40">
                    <Icons.Alert />
                  </div>
                  <div>
                    <h3 className="text-base font-bold text-white">
                      🚨 05 用・現場基層緊急煞車控制台！
                    </h3>
                    <p className="text-xs text-red-400">
                      【C4 警報器逼逼叫！】AI 發現這張急單毛利低於 15%，強制攔截交由你做決定！
                    </p>
                  </div>
                </div>

                <div className="bg-slate-950 rounded-xl p-4 border border-slate-800 my-4">
                  <div className="text-xs font-bold text-amber-400 mb-1">
                    {pendingHITLCard.title}
                  </div>
                  <p className="text-xs text-slate-300 leading-relaxed mb-3">
                    {pendingHITLCard.content}
                  </p>
                  <div className="text-[11px] text-slate-400 border-t border-slate-800 pt-2">
                    ※ 老闆合約底線：毛利不得低於 15%。若硬接會造成嚴重違約索賠！
                  </div>
                </div>

                <div className="flex flex-col gap-2.5 mt-5">
                  <button
                    onClick={() => handleHITLDecision('A')}
                    className="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-xs font-bold text-white shadow-lg shadow-emerald-500/20 text-left flex items-center justify-between"
                  >
                    <span>[選項 A] {pendingHITLCard.hitlActionA}</span>
                    <span className="font-mono text-[10px] bg-emerald-950 px-2 py-0.5 rounded border border-emerald-400">
                      寫入存摺
                    </span>
                  </button>

                  <button
                    onClick={() => handleHITLDecision('B')}
                    className="w-full py-3 px-4 rounded-xl bg-red-950/60 hover:bg-red-900/60 border border-red-600/60 text-xs font-bold text-red-300 text-left flex items-center justify-between"
                  >
                    <span>[選項 B] {pendingHITLCard.hitlActionB}</span>
                    <span className="font-mono text-[10px] text-red-400">
                      踩中劇毒黑天鵝
                    </span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ================================================================= */}
          {/* FIELD FOUR QUESTIONS MODAL                                        */}
          {/* ================================================================= */}
          {showFourQuestionsModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-2xl w-full p-6 shadow-2xl max-h-[85vh] overflow-y-auto">
                <div className="flex items-center justify-between pb-3 border-b border-slate-800 mb-4">
                  <h3 className="text-base font-bold text-white flex items-center gap-2">
                    <Icons.Info />
                    <span>A47 開場四問：生活白話自我體檢字典</span>
                  </h3>
                  <button
                    onClick={() => setShowFourQuestionsModal(false)}
                    className="text-slate-400 hover:text-white"
                  >
                    <Icons.Cross />
                  </button>
                </div>

                <div className="space-y-4 text-xs text-slate-300 leading-relaxed font-sans">
                  <div className="p-3 rounded-lg bg-slate-950 border border-slate-800">
                    <div className="font-bold text-cyan-400 mb-1">01 需（現場邊界在哪？不瞎猜情報）</div>
                    <p className="text-slate-400">
                      AI 最怕閉著眼睛瞎猜！製造業要看現場機台是不是卡料，旅行社要看客人有沒有簽證。這就是【K1 現場眼睛】。
                    </p>
                  </div>

                  <div className="p-3 rounded-lg bg-slate-950 border border-slate-800">
                    <div className="font-bold text-red-400 mb-1">02 痛（最怕哪一種毒蛇黑天鵝？）</div>
                    <p className="text-slate-400">
                      太緊張把繩子當成毒蛇（誤殺），頂多浪費一點人工查看的工錢；但如果「把劇毒眼鏡蛇當成跳繩抓」（漏放），公司會直接破產倒閉！所以必須裝【C4 警報器】。
                    </p>
                  </div>

                  <div className="p-3 rounded-lg bg-slate-950 border border-slate-800">
                    <div className="font-bold text-amber-400 mb-1">03 驗（積木有沒有亂插？）</div>
                    <p className="text-slate-400">
                      工具沒裝【C5 萬國插座】費用會暴增 3 倍；小腦如果誤塞了【W3 天才思考】，買一杯珍珠奶茶要等半小時，客戶氣到砸店（好心做壞事）。
                    </p>
                  </div>

                  <div className="p-3 rounded-lg bg-slate-950 border border-slate-800">
                    <div className="font-bold text-purple-400 mb-1">04 契（老闆有沒有講清楚賺錢底線？）</div>
                    <p className="text-slate-400">
                      老闆必須先簽署【W1 總裁合約】，命令系統「毛利低於 15% 絕對不准接單」，否則 AI 只會盲目衝訂單量，最後賠本倒閉。
                    </p>
                  </div>

                  <div className="p-3 rounded-lg bg-slate-950 border border-slate-800">
                    <div className="font-bold text-emerald-400 mb-1">05 用（現場處置有沒有抄成 SOP？）</div>
                    <p className="text-slate-400">
                      基層員工化解危機後，要寫回存摺，並在第 3 關把經驗「抄成 SOP 秘笈」，讓小腦以後也能 2 秒光速搞定大訂單！
                    </p>
                  </div>
                </div>

                <div className="mt-5 text-right">
                  <button
                    onClick={() => setShowFourQuestionsModal(false)}
                    className="px-4 py-2 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-xs font-bold text-white transition"
                  >
                    我知道了，返回遊戲
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
